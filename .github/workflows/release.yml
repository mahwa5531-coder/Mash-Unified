name: Release Desktop App

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish to official GitHub Releases?'
        required: true
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release-windows:
    name: Build & Package Windows Executable (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Install Node dependencies
        run: |
          npm ci
          npm --prefix frontend ci

      - name: Build Frontend Static Export
        run: npm run build:frontend

      - name: Build Python Connector & Sandbox Sidecars
        run: npm run build:backend

      - name: Verify Compiled Sidecar Binaries
        shell: powershell
        run: |
          if (-not (Test-Path "dist/bin/connector/connector.exe")) {
            throw "dist/bin/connector/connector.exe was not created!"
          }
          if (-not (Test-Path "dist/bin/connector/python.exe")) {
            throw "dist/bin/connector/python.exe was not created!"
          }
          Write-Host "Both connector.exe and python.exe compiled successfully!"

      - name: Package Desktop Installer (Electron Builder)
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          npx electron-builder --win nsis

      - name: Upload Installer Artifacts to Workflow Run
        uses: actions/upload-artifact@v4
        with:
          name: Mash-Windows-Installer
          path: |
            dist/release/*.exe
            dist/release/latest.yml
            dist/release/*.blockmap

      - name: Publish to Public Releases Repo (mahwa5531-coder/mash-releases)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          repository: mahwa5531-coder/mash-releases
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist/release/*.exe
            dist/release/latest.yml
            dist/release/*.blockmap
          generate_release_notes: true

      - name: Deploy Public Installer & Updates to Cloudflare R2
        if: env.R2_SECRET_ACCESS_KEY != ''
        shell: powershell
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          BUCKET: ${{ secrets.R2_BUCKET_NAME || 'mash-releases' }}
        run: |
          $endpoint = "https://${env:ACCOUNT_ID}.r2.cloudflarestorage.com"
          Write-Host "Syncing release artifacts to Cloudflare R2 bucket: ${env:BUCKET}..."
          
          aws s3 sync dist/release s3://${env:BUCKET}/ `
            --endpoint-url $endpoint `
            --exclude "*" `
            --include "*.exe" `
            --include "latest.yml" `
            --include "*.blockmap"
          
          $latestExe = (Get-ChildItem dist/release/*.exe | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if ($latestExe) {
            Write-Host "Publishing permanent generic installer Mash-Setup.exe..."
            aws s3 cp "$latestExe" "s3://${env:BUCKET}/Mash-Setup.exe" --endpoint-url $endpoint
          }
          Write-Host "Successfully published to Cloudflare R2!"

name: CI Pipeline

on:
  push:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches: [ master, main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Build & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Cache Next.js build cache
        uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('frontend/package-lock.json') }}-

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build and verify TypeScript
        run: npm --prefix frontend run build

      - name: Run Frontend Test Suite
        run: npm --prefix frontend test

  python-backend:
    name: Python Backend (NexAU & Connector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio anyio httpx respx hypothesis psutil pytest-timeout

      - name: Verify Python Syntax & Undefined Symbols
        run: |
          python -m ruff check NexAU/ connector/ --select E9,F821

      - name: Run NexAU Agent Harness Evaluation Tests
        env:
          PYTHONPATH: "connector:NexAU"
          MASH_ENV: "test"
          LLM_BASE_URL: "http://localhost:11434/v1"
          LLM_MODEL: "llama3.2"
          LLM_API_KEY: "ollama"
          LLM_API_TYPE: "openai_chat_completion"
        run: |
          python -m pytest NexAU/tests/harness_eval/ -v

      - name: Run Connector Backend Unit & Contract Tests
        env:
          PYTHONPATH: "connector:NexAU"
          MASH_ENV: "test"
          LLM_API_KEY: "mock-test-key"
        run: |
          python -m pytest \
            connector/tests/test_backend_sanity.py \
            connector/tests/test_tasks_api.py \
            connector/tests/test_file_access_boundaries.py \
            connector/tests/test_desktop_attached_file_authorization.py \
            connector/tests/test_ui_backend_endpoints.py \
            connector/tests/test_clean_title_and_tags.py \
            connector/tests/test_atomic_session_deletion.py \
            connector/tests/test_stream_idempotency.py \
            connector/tests/test_heartbeat_shield.py \
            -v --timeout=45

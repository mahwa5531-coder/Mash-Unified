name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Build & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build and verify TypeScript
        run: npm --prefix frontend run build

  python-backend:
    name: Python Backend (NexAU & Connector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio anyio httpx respx

      - name: Verify Python Syntax & Undefined Symbols
        run: |
          python -m ruff check NexAU/ connector/ --select E9,F821

      - name: Run Connector and NexAU Tests
        env:
          PYTHONPATH: "connector:NexAU"
        run: |
          python -m pytest connector/tests/ NexAU/tests/unit/ -v -m "not external and not llm and not live_nightly"

  cloud-api:
    name: Cloud API (Go Services)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.24'
          cache-dependency-path: 'cloud-api/go.sum'

      - name: Run Cloud API Tests
        working-directory: cloud-api
        run: go test ./... -v

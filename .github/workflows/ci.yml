name: CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Build & Typecheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm --prefix frontend ci

      - name: Build and verify TypeScript
        run: npm --prefix frontend run build

      - name: Run Frontend Test Suite
        run: npm --prefix frontend test

  python-backend:
    name: Python Backend (NexAU & Connector)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest pytest-asyncio anyio httpx respx hypothesis psutil pytest-timeout

      - name: Verify Python Syntax & Undefined Symbols
        run: |
          python -m ruff check NexAU/ connector/ --select E9,F821

      - name: Run Connector and NexAU Tests
        env:
          PYTHONPATH: "connector:NexAU"
          MASH_ENV: "test"
          LLM_BASE_URL: "http://localhost:11434/v1"
          LLM_MODEL: "llama3.2"
          LLM_API_KEY: "ollama"
          LLM_API_TYPE: "openai_chat_completion"
        run: |
          python -m pytest connector/tests/ NexAU/tests/unit/test_storage_scaffold.py -v


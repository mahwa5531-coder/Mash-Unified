type: tool
name: view_file
description: |
  View the contents of a file from the local filesystem. This tool supports source code/text files, directories, spreadsheets (.xlsx, .xls, .csv, .tsv), visual media (images & video), and PDF documents.

  SUPPORTED FILE TYPES:
  - Text & Source Code: All plain text, code (.py, .ts, .js, .sql), JSON, YAML, Markdown, XML, config files.
    - 1-indexed line numbers. Specify StartLine and EndLine to view specific line ranges (up to 800 lines per call).
    - If unbounded, defaults to the first 100 lines.
    - If content exceeds 46KB, use ContentOffset to paginate through raw bytes.
  - PDF Documents (.pdf):
    - Ingests all PDF documents via hybrid visual/text extraction (renders visual pages to 200 DPI images for multimodal perception).
    - Specify StartLine and EndLine to view specific page ranges (e.g. StartLine=1, EndLine=20).
    - ALWAYS call view_file directly for PDF documents; NEVER write custom scripts to parse PDFs.
  - Spreadsheets & Tabular Data (.xlsx, .xls, .csv, .tsv):
    - Automatically parses layout and renders a spatial Markdown preview for orientation.
    - Pass sheet_name='<Name>' to inspect a specific Excel sheet directly.
  - Images & Video (.png, .jpg, .jpeg, .webp, .bmp, .svg, .gif, .mp4, etc.):
    - Delivered directly as multimodal visual image/video blocks.
  - Directories:
    - Lists folder structure and child files.

  UNSUPPORTED FILE TYPES (DO NOT CALL view_file FOR THESE):
  - Binary Columnar Datasets (.parquet, .feather, .arrow):
    - NOT supported by view_file. Use run_shell_command with Python / DuckDB (e.g. `python -c "import duckdb; print(duckdb.read_parquet('file.parquet'))"`).
  - Databases (.sqlite, .db, .duckdb):
    - NOT supported by view_file. Use run_shell_command with sqlite3 or Python duckdb.
  - Office Documents (.docx, .doc, .pptx, .ppt):
    - NOT supported by view_file. Use run_shell_command with Python libraries (docx2txt, python-pptx) to extract text or convert pages to PNG, then inspect via view_file.
  - Compressed Archives (.zip, .tar, .gz, .7z, .rar):
    - NOT supported by view_file. Use run_shell_command with tar/unzip or Python zipfile.
  - Compiled Binaries (.exe, .dll, .so, .dylib, .pyc, .bin, .iso):
    - NOT supported.
  - Audio Files (.mp3, .wav, .aac, .flac):
    - NOT supported.

input_schema:
  type: object
  properties:
    AbsolutePath:
      type: string
      description: "Path to file or directory to view. Must be an absolute path or workspace-relative path."
    file_path:
      type: string
      description: "Alias for AbsolutePath."
    path:
      type: string
      description: "Alias for AbsolutePath."
    StartLine:
      type: integer
      description: "Optional. Startline to view, 1-indexed, inclusive. When specified, this value must be less than or equal to EndLine."
    start_line:
      type: integer
      description: "Alias for StartLine."
    EndLine:
      type: integer
      description: "Optional. Endline to view, 1-indexed, inclusive. When specified, this value must be greater than or equal to StartLine."
    end_line:
      type: integer
      description: "Alias for EndLine."
    ContentOffset:
      type: integer
      description: "Optional. Byte offset into the content. Use this to view content beyond the initial byte limit when the tool output indicates content was truncated."
    content_offset:
      type: integer
      description: "Alias for ContentOffset."
    ByteOffset:
      type: integer
      description: "Alias for ContentOffset."
    byte_offset:
      type: integer
      description: "Alias for ContentOffset."
    sheet_name:
      type: string
      description: "Optional (Excel only): The specific sheet name to read (e.g. 'Sales Register', 'P&L'). If omitted on multi-sheet workbooks, returns the sheet index."
    toolAction:
      type: string
      description: "Brief 2-5 word summary of what this tool is doing. Capitalize like a sentence."
    toolSummary:
      type: string
      description: "Brief 2-5 word noun phrase describing what this tool call is about. Capitalize like a sentence."
  required:
    - AbsolutePath
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

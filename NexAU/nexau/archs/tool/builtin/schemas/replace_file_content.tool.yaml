type: tool
name: replace_file_content
description: |
  Use this tool to edit an existing file. Follow these rules:
  1. Use this tool ONLY when you are making a SINGLE CONTIGUOUS block of edits to the same file (i.e. replacing a single contiguous block of text).
  2. Do NOT make multiple parallel calls to this tool for the same file.
  3. To edit multiple, non-adjacent lines of code in the same file, make multiple calls to this tool.
  4. For the ReplacementChunk, specify StartLine, EndLine, TargetContent and ReplacementContent. StartLine and EndLine should specify a range of lines containing precisely the instances of TargetContent that you wish to edit. To edit a single instance of the TargetContent, the range should be such that it contains that specific instance of the TargetContent and no other instances. In TargetContent, specify the precise lines of code to edit. These lines MUST EXACTLY MATCH text in the existing file content. In ReplacementContent, specify the replacement content for the specified target content. This must be a complete drop-in replacement of the TargetContent, with necessary modifications made.
  5. If you are making multiple edits across a single file, make multiple calls to this tool. DO NOT try to replace the entire existing content with the new content, this is very expensive.
  6. You may not edit file extensions: [.ipynb]

input_schema:
  type: object
  properties:
    TargetFile:
      type: string
      description: "The target file to modify. Must be an absolute path or workspace-relative path. Always specify the target file as the very first argument."
    file_path:
      type: string
      description: "Alias for TargetFile."
    StartLine:
      type: integer
      description: "The starting line number of the chunk (1-indexed). Should be at or before the first line containing the target content. Must satisfy 1 <= StartLine <= EndLine."
    start_line:
      type: integer
      description: "Alias for StartLine."
    EndLine:
      type: integer
      description: "The ending line number of the chunk (1-indexed). Should be at or after the last line containing the target content. Must satisfy StartLine <= EndLine <= number of lines in the file."
    end_line:
      type: integer
      description: "Alias for EndLine."
    TargetContent:
      type: string
      description: "The exact string to be replaced. This must be the exact character-sequence to be replaced, including whitespace. Be very careful to include any leading whitespace otherwise this will not work at all. This must be a unique substring within the file, or else it will error."
    old_string:
      type: string
      description: "Alias for TargetContent."
    ReplacementContent:
      type: string
      description: "The content to replace the target content with."
    new_string:
      type: string
      description: "Alias for ReplacementContent."
    AllowMultiple:
      type: boolean
      default: false
      description: "If true, multiple occurrences of 'TargetContent' within the line range will be replaced by 'ReplacementContent'. Otherwise if multiple occurrences are found, an error will be returned."
    allow_multiple:
      type: boolean
      description: "Alias for AllowMultiple."
    Instruction:
      type: string
      description: "A description of the changes that you are making to the file."
    instruction:
      type: string
      description: "Alias for Instruction."
    Description:
      type: string
      description: "Brief, user-facing explanation of what this change did. Focus on non-obvious rationale, design decisions, or important context. Don't just restate what the code does."
    description:
      type: string
      description: "Alias for Description."
    TargetLintErrorIds:
      type: array
      items:
        type: string
      description: "If applicable, IDs of lint errors this edit aims to fix (they'll have been given in recent IDE feedback)."
    toolAction:
      type: string
      description: "Brief 2-5 word summary of what this tool is doing. Capitalize like a sentence."
    toolSummary:
      type: string
      description: "Brief 2-5 word noun phrase describing what this tool call is about. Capitalize like a sentence."
  required:
    - TargetFile
    - StartLine
    - EndLine
    - TargetContent
    - ReplacementContent
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

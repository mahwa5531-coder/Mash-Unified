type: tool
name: web_search
description: >-
  Perform a live web search using DuckDuckGo to find up-to-date information,
  documentation, references, and websites without requiring any API keys.
input_schema:
  $schema: http://json-schema.org/draft-07/schema#
  type: object
  properties:
    query:
      type: string
      description: The search query string.
    domain:
      type: string
      default: ""
      description: Optional domain or website to restrict results to (e.g., 'github.com' or 'python.org').
    num_results:
      type: integer
      default: 4
      minimum: 1
      maximum: 20
      description: Maximum number of search results to return (default 4).
  required:
    - query
  additionalProperties: false

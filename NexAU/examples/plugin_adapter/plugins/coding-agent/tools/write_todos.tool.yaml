type: tool
name: write_todos
description: >-
  Use this tool to track subtasks and execution progress for complex multi-step engagements.
  Maintains an observable checklist for the user UI.
  - pending: Work has not begun on the subtask.
  - in_progress: Currently being executed (keep only one subtask in_progress at a time).
  - completed: Subtask successfully finished.
  - cancelled: Subtask is no longer needed.
input_schema:
  type: object
  properties:
    todos:
      type: array
      description: "The complete list of todo items. Replaces the current active list."
      items:
        type: object
        description: A single todo item.
        properties:
          description:
            type: string
            description: The description of the task.
          status:
            type: string
            description: The current status of the task.
            enum:
              - pending
              - in_progress
              - completed
              - cancelled
        required:
          - description
          - status
        additionalProperties: false
  required:
    - todos
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

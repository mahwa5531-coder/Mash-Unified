type: tool
name: search_file_content
description: >-
  Searches for regular expression patterns across files in a directory using ripgrep
  with automatic fallback to Python grep. Returns matching line numbers and content.
  Results are capped at 50 matches for performance.
  Example usage: search for functions using pattern="def .*\(", or filter by file type using include="*.py".
input_schema:
  type: object
  properties:
    pattern:
      type: string
      description: "The regular expression pattern to search for (e.g. 'def .*\\(', 'class .*Model')."
    Query:
      type: string
      description: "Alias for pattern."
    query:
      type: string
      description: "Alias for pattern."
    dir_path:
      type: string
      description: "Optional directory to search in. Defaults to the current working directory."
    SearchPath:
      type: string
      description: "Alias for dir_path."
    path:
      type: string
      description: "Alias for dir_path."
    include:
      type: string
      description: "Optional glob pattern to filter files (e.g. '*.py', '*.{ts,tsx}', '*.json')."
    Includes:
      type: string
      description: "Alias for include."
    toolAction:
      type: string
      description: "Brief 2-5 word phrase in -ing form describing the specific action. Capitalize like a sentence. Some examples: 'Analyzing directory', 'Searching the web', 'Checking git status', 'Running tests', 'Searching code'."
    toolSummary:
      type: string
      description: "Brief 2-5 word noun phrase describing the specific task. Capitalize like a sentence. Some examples: 'Directory analysis', 'Web search', 'Git status check', 'Test execution', 'Code search'."
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

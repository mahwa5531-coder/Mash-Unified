type: tool
name: WebFetch
description: "- Fetches content from a specified URL and processes it using an AI\
  \ model - Takes a URL and a prompt as input - Fetches the URL content, converts\
  \ HTML to markdown - Processes the content with the prompt using a small, fast model\
  \ - Returns the model's response about the content - Use this tool when you need\
  \ to retrieve and analyze web content\nUsage notes:\n  - IMPORTANT: If an MCP-provided\
  \ web fetch tool is available, prefer using\n    that tool instead of this one,\
  \ as it may have fewer restrictions. All\n    MCP-provided tools start with \"mcp__\"\
  .\n  - The URL must be a fully-formed valid URL\n  - HTTP URLs will be automatically\
  \ upgraded to HTTPS\n  - The prompt should describe what information you want to\
  \ extract from the\n    page\n  - This tool is read-only and does not modify any\
  \ files\n  - Results may be summarized if the content is very large\n  - Includes\
  \ a self-cleaning 15-minute cache for faster responses when\n    repeatedly accessing\
  \ the same URL\n  - When a URL redirects to a different host, the tool will inform\
  \ you and\n    provide the redirect URL in a special format. You should then make\
  \ a new\n    WebFetch request with the redirect URL to fetch the content."
input_schema:
  type: object
  properties:
    url:
      type: string
      description: URL to fetch
    toolAction:
      type: string
      description: Brief 2-5 word phrase in -ing form describing the specific action.
        Capitalize like a sentence.
    toolSummary:
      type: string
      description: Brief 2-5 word noun phrase describing the specific task. Capitalize
        like a sentence.
  required:
  - url
  - toolAction
  - toolSummary
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

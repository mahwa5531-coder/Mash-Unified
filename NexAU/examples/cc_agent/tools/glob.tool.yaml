type: tool
name: glob
description: 'Finds files matching a glob pattern, returned sorted by modification
  time (newest first). Ideal for quickly locating files by name or path structure.
  Example usage: glob(pattern="**/*.py") or glob(pattern="docs/*.md", dir_path="./project").'
input_schema:
  type: object
  properties:
    pattern:
      type: string
      description: Glob pattern to match files (e.g. '**/*.py', 'src/**/*.ts', 'data/*.csv').
    dir_path:
      type: string
      description: Optional directory to search in. Defaults to the current working
        directory.
    case_sensitive:
      type: boolean
      description: Optional boolean whether pattern matching should be case-sensitive
        (default false).
    toolAction:
      type: string
      description: Brief 2-5 word phrase in -ing form describing the specific action.
        Capitalize like a sentence.
    toolSummary:
      type: string
      description: Brief 2-5 word noun phrase describing the specific task. Capitalize
        like a sentence.
  required:
  - pattern
  - toolAction
  - toolSummary
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

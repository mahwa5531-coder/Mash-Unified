type: tool
name: LoadSkill
description: Load a skill from skill folders. If user task is related to a skill,
  you can use this tool to load the skill for detailed information about the skill.
input_schema:
  type: object
  properties:
    skill_name:
      type: string
      description: The name of the skill to load
    toolAction:
      type: string
      description: Brief 2-5 word phrase in -ing form describing the specific action.
        Capitalize like a sentence.
    toolSummary:
      type: string
      description: Brief 2-5 word noun phrase describing the specific task. Capitalize
        like a sentence.
  required:
  - skill_name
  - toolAction
  - toolSummary
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

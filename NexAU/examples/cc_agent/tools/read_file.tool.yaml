type: tool
name: read_file
description: >-
  Reads file contents from the workspace or local filesystem.
  Supports source code, text, Markdown, and tabular spreadsheets/CSVs with automated DuckDB Parquet caching.

  Statutory & Financial Ingestion:
  1. Spreadsheets (.xlsx, .xls, .csv, .tsv, .parquet):
     - Multi-sheet Excel files: When read without `sheet_name`, returns the workbook index with all sheets, row counts, and column counts.
     - Specific Schedules: Pass `sheet_name='<Exact Sheet Name>'` to extract financial statements (e.g. 'P&L Statement', 'Sales Register').
     - Small tables (<=100 rows): Rendered directly inline as structured Markdown tables.
     - Large datasets (>100 rows): Automatically converted to In-RAM '.parquet' cache with column schemas and 5-row preview.
  2. Source Code & Text (.py, .ts, .json, .md, .txt, .sql, .yaml):
     - Returns text content with 1-based line numbers.
     - For large files, use `offset` and `limit` to paginate.
input_schema:
  type: object
  properties:
    file_path:
      type: string
      description: "The path to the file to read (absolute or workspace-relative)."
    sheet_name:
      type: string
      description: "Optional (Excel only): The specific sheet name to read (e.g. 'Sales Register', 'P&L'). If omitted on multi-sheet workbooks, returns the sheet index."
    offset:
      type: integer
      description: "Optional (Text/Code only): 0-based line number to start reading from."
    limit:
      type: integer
      description: "Optional (Text/Code only): Maximum number of lines to read. Defaults to 2000."
  required:
    - file_path
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

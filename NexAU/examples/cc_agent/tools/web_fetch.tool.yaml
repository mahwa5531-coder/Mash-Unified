type: tool
name: web_fetch
description: |
  Fetch content from a URL via HTTP request. Converts HTML to markdown.
  Use when:
  (1) extracting text from public pages,
  (2) reading static content, articles, or documentation,
  (3) inspecting specific webpage details found during search,
  (4) speed is important, or
  (5) no visual interaction needed.
  Converts HTML to markdown. No JavaScript execution, no authentication.

input_schema:
  type: object
  properties:
    url:
      type: string
      description: "The HTTP or HTTPS URL to fetch and read content from."
    prompt:
      type: string
      description: "Optional natural language prompt containing the target URL."
    timeout:
      type: integer
      description: "Optional timeout in seconds (defaults to 100)."
    use_html_parser:
      type: boolean
      description: "Whether to convert HTML to clean markdown (default: true)."
    toolAction:
      type: string
      description: "Brief 2-5 word phrase in -ing form describing the specific action."
    toolSummary:
      type: string
      description: "Brief 2-5 word noun phrase describing the specific task."
  anyOf:
    - required:
        - url
    - required:
        - prompt
  additionalProperties: true
  $schema: http://json-schema.org/draft-07/schema#

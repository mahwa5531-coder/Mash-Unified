type: tool
name: audit_skill_tool
description: |
  Master Statutory Audit Knowledge & Workflow Grounding Engine for Indian CA/CPA
  engagements.

  Provides structured, standardized audit procedures across 72 procedures and
  17 ICAI / Companies Act 2013 domains.

  `get_skill` retrieves the detailed methodology for a specific audit area,
  including objectives, scope, dependencies, required inputs, procedures,
  decision points, professional-skepticism probes, risks, fraud indicators,
  validation criteria, expected outputs, and escalation conditions.

  `search_skills` locates relevant procedures by keyword.
  `list_skills` lists procedures available within a domain.
  `get_guide` provides the overall navigation guide across audit domains.

  Use this tool when the task requires defined audit methodology, testing
  procedures, applicable criteria, evidence requirements, sampling guidance,
  decision points, or workpaper expectations.

  The retrieved workflow is a professional methodology reference. The agent
  must apply it to the actual engagement, evidence, data, and scope rather than
  assuming every step is applicable in every case.

input_schema:
  type: object
  properties:
    action:
      type: string
      enum: [get_skill, search_skills, list_skills, get_guide]
      description: "The audit knowledge action to perform."
    skill_name:
      type: string
      description: "Slug of the audit skill to retrieve (e.g. '01_materiality_determination_sa_320')."
    query:
      type: string
      description: "Required when action is 'search_skills'. Search term or keywords."
    domain:
      type: string
      description: "Optional domain filter for action='list_skills' (e.g. '01-engagement-and-planning', '12-taxation')."
    toolAction:
      type: string
      description: "Brief 2-5 word phrase in -ing form describing the specific action. Capitalize like a sentence. Some examples: 'Analyzing directory', 'Searching the web', 'Checking git status', 'Running tests', 'Searching code'."
    toolSummary:
      type: string
      description: "Brief 2-5 word noun phrase describing the specific task. Capitalize like a sentence. Some examples: 'Directory analysis', 'Web search', 'Git status check', 'Test execution', 'Code search'."
  required:
    - action
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#

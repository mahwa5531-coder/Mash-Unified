type: tool
name: list_directory
description: |
  Lists the contents of a directory (all files and subdirectories that are direct children).
  Results include file sizes, item types, and are sorted directories-first.

  CRITICAL:
  - `dir_path` MUST be a directory or folder path (e.g. '.', 'src', 'C:/Users/rama/Downloads').
  - Do NOT pass a file path to this tool.
  - If you already have a specific file path, call `read_file` directly to view its contents.

input_schema:
  type: object
  properties:
    dir_path:
      type: string
      description: "The path to the directory or folder to list (must be a directory, not a file)."
    ignore:
      type: array
      items:
        type: string
      description: "Optional list of glob patterns to ignore (e.g. ['*.pyc', 'node_modules', '.git'])."
    show_hidden:
      type: boolean
      default: true
      description: "Optional boolean whether to include hidden files starting with a dot (default true)."
  required:
    - dir_path
  additionalProperties: false
  $schema: http://json-schema.org/draft-07/schema#
